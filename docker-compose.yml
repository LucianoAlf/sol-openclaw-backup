services:
  sol-adm:
    build: .
    container_name: sol-adm
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./workspace:/workspace
      - codex-auth:/root/.codex
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  codex-auth:
